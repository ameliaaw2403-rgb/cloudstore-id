<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Store — Marketplace</title>
  <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Header -->
    <header class="header">
      <div class="header-logo-container">
        <svg class="header-logo" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="cloudGradient4" x1="0%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" style="stop-color:#1E90FF;stop-opacity:1" />
              <stop offset="100%" style="stop-color:#0047AB;stop-opacity:1" />
            </linearGradient>
          </defs>
          <ellipse cx="200" cy="200" rx="150" ry="120" fill="url(#cloudGradient4)" />
          <g transform="translate(200, 200)">
            <path d="M -60 -20 L -50 40 C -50 50 -40 60 -30 60 L 80 60 C 90 60 100 50 100 40 L 110 -20" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M -60 -20 Q -70 -50 0 -60 Q 70 -50 110 -20" stroke="white" stroke-width="10" fill="none" stroke-linecap="round"/>
            <circle cx="-20" cy="70" r="8" fill="white"/>
            <circle cx="70" cy="70" r="8" fill="white"/>
            <g fill="#FFD700">
              <path d="M -35 0 L -30 15 L -15 15 L -25 25 L -20 40 L -35 30 L -50 40 L -45 25 L -55 15 L -40 15 Z" />
              <path d="M -10 0 L -5 15 L 10 15 L 0 25 L 5 40 L -10 30 L -25 40 L -20 25 L -30 15 L -15 15 Z" />
              <path d="M 15 0 L 20 15 L 35 15 L 25 25 L 30 40 L 15 30 L 0 40 L 5 25 L -5 15 L 10 15 Z" />
              <path d="M 40 0 L 45 15 L 60 15 L 50 25 L 55 40 L 40 30 L 25 40 L 30 25 L 20 15 L 35 15 Z" />
              <path d="M 65 0 L 70 15 L 85 15 L 75 25 L 80 40 L 65 30 L 50 40 L 55 25 L 45 15 L 60 15 Z" />
            </g>
            <ellipse cx="-20" cy="-30" rx="30" ry="15" fill="white" opacity="0.3"/>
          </g>
          <g fill="#FFD700">
            <rect x="320" y="140" width="6" height="20" rx="3" />
            <rect x="310" y="155" width="26" height="6" rx="3" transform="rotate(-45 323 158)" />
            <rect x="340" y="155" width="26" height="6" rx="3" transform="rotate(45 353 158)" />
          </g>
        </svg>
        <span>Cloud Store</span>
      </div>
      <div class="header-content">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Cari nama produk...">
          <button id="searchBtn">🔍</button>
        </div>
        <button id="notifBtn" class="notif-btn">🔔</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Info Banner -->
      <section class="info-banner">
        <div class="banner-header">
          <h3>Marketplace Indonesia</h3>
        </div>
        <div class="banner-message">
          <p>Setiap Pesanan yang diselesaikan bersama pasangan anda akan mendapatkan komisi komisi</p>
        </div>
      </section>

      <!-- Tab Navigation -->
      <div class="tab-nav">
        <button class="tab-btn active" data-tab="semua">Semua produk</button>
        <button class="tab-btn" data-tab="promo">Produk promo</button>
      </div>

      <!-- Promo Banner -->
      <section class="promo-banner">
        <div class="promo-text">
          <h2>8% - 10%</h2>
          <p>Setiap Pesanan yang diselesaikan bersama pasangan anda akan mendapatkan komisi komisi</p>
        </div>
      </section>

      <!-- Products Grid -->
      <section class="products-section">
        <h3 class="section-title">Sistem ambil pesanan</h3>
        <div class="products-grid" id="productsGrid">
          <!-- Products will be loaded here -->
        </div>
      </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Beranda</span>
      </a>
      <a href="#" class="nav-item" data-page="bantuan">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Bantuan</span>
      </a>
      <a href="#" class="nav-item" data-page="aktivitas">
        <span class="nav-icon">🎁</span>
        <span class="nav-label">Aktivitas</span>
      </a>
      <a href="#" class="nav-item" data-page="akun">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Akun</span>
      </a>
    </nav>
  </div>

  <!-- Product Detail Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div class="modal-header">
        <img id="modalProductImage" src="" alt="Product">
      </div>
      <div class="modal-body">
        <h2 id="modalProductName"></h2>
        <div class="modal-price">
          <span class="original-price" id="modalOriginalPrice"></span>
          <span class="current-price" id="modalCurrentPrice"></span>
        </div>
        <div class="modal-commission">
          <span id="modalCommission"></span>
        </div>
        <p id="modalProductDesc" class="product-description"></p>
        <button id="buyBtn" class="buy-btn">Beli Sekarang</button>
        <button id="chooseGiftBtn" class="choose-gift-btn">Pilih Hadiah</button>
      </div>
    </div>
  </div>

  <!-- Gift Selection Modal -->
  <div id="giftModal" class="modal">
    <div class="modal-content gift-modal">
      <span class="close-btn">&times;</span>
      <h2>Pilih Hadiah</h2>
      <div class="gifts-grid" id="giftsGrid">
        <!-- Gifts will be loaded here -->
      </div>
      <button id="confirmGiftBtn" class="confirm-btn">Konfirmasi Pilihan</button>
    </div>
  </div>

  <!-- Login Check -->
  <script src="dashboard-script.js"></script>
</body>
</html>
