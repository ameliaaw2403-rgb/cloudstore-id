<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Store — Marketplace</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="dashboard-style.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <div class="header-logo-container">
        <img class="header-logo" src="logo.svg" alt="Cloud Store logo">
      </div>
      <div class="header-content">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Cari nama produk...">
          <button id="searchBtn">🔍</button>
        </div>
        <button id="notifBtn" class="notif-btn">🔔</button>
      </div>
    </header>

    <main class="main-content">
      <section class="info-banner">
        <div class="banner-header">
          <h3>Marketplace Indonesia</h3>
        </div>
        <div class="banner-message">
          <p>Setiap Pesanan yang diselesaikan bersama pasangan anda akan mendapatkan komisi komisi</p>
        </div>
      </section>

      <div class="tab-nav">
        <button class="tab-btn active" data-tab="semua">Semua produk</button>
        <button class="tab-btn" data-tab="promo">Produk promo</button>
      </div>

      <section class="promo-banner">
        <div class="promo-text">
          <h2>8% - 10%</h2>
          <p>Setiap Pesanan yang diselesaikan bersama pasangan anda akan mendapatkan komisi komisi</p>
        </div>
      </section>

      <section class="products-section">
        <h3 class="section-title">Sistem ambil pesanan</h3>
        <div class="products-grid" id="productsGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Beranda</span>
      </a>
      <a href="#" class="nav-item" data-page="bantuan">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Bantuan</span>
      </a>
      <a href="#" class="nav-item" data-page="aktivitas">
        <span class="nav-icon">🎁</span>
        <span class="nav-label">Aktivitas</span>
      </a>
      <a href="#" class="nav-item" data-page="akun">
        <span class="nav-icon">👤</span>
        <span class="nav-label">Akun</span>
      </a>
    </nav>
  </div>

  <div id="productModal" class="modal">
    <div class="modal-content">
      <span class="close-btn">&times;</span>
      <div class="modal-header">
        <img id="modalProductImage" src="" alt="Product">
      </div>
      <div class="modal-body">
        <h2 id="modalProductName"></h2>
        <div class="modal-price">
          <span class="original-price" id="modalOriginalPrice"></span>
          <span class="current-price" id="modalCurrentPrice"></span>
        </div>
        <div class="modal-commission">
          <span id="modalCommission"></span>
        </div>
        <p id="modalProductDesc" class="product-description"></p>
        <button id="buyBtn" class="buy-btn">Beli Sekarang</button>
        <button id="chooseGiftBtn" class="choose-gift-btn">Pilih Hadiah</button>
      </div>
    </div>
  </div>

  <div id="giftModal" class="modal">
    <div class="modal-content gift-modal">
      <span class="close-btn">&times;</span>
      <h2>Pilih Hadiah</h2>
      <div class="gifts-grid" id="giftsGrid"></div>
      <button id="confirmGiftBtn" class="confirm-btn">Konfirmasi Pilihan</button>
    </div>
  </div>

  <script src="dashboard-script.js"></script>
</body>
</html>
