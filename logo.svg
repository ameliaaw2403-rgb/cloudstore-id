<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Cloud Store</title>
  <defs>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9FFF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
  </defs>

  <!-- Cloud Background -->
  <path d="M 180 160 C 160 160 145 175 145 195 C 145 175 130 160 110 160 C 75 160 50 185 50 220 C 50 255 75 280 110 280 L 380 280 C 420 280 450 250 450 210 C 450 175 425 145 390 140 C 385 105 355 80 320 80 C 295 80 273 92 260 110 C 245 95 225 85 205 85 C 165 85 130 115 125 155 C 100 160 80 180 80 205 L 380 280" fill="url(#cloudGradient)"/>

  <!-- Shopping Cart -->
  <g transform="translate(120, 140)">
    <!-- Cart Body -->
    <path d="M 40 30 L 50 80 C 51 85 55 88 60 88 L 200 88 C 205 88 209 85 210 80 L 225 30 Z" fill="white" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Cart Handle -->
    <path d="M 65 25 Q 120 -15 180 25" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Cart Wheels -->
    <circle cx="85" cy="100" r="12" fill="white"/>
    <circle cx="195" cy="100" r="12" fill="white"/>
    
    <!-- Stars -->
    <g fill="#FFA500">
      <!-- Star 1 -->
      <path d="M 90 65 L 95 78 L 108 78 L 97 87 L 102 100 L 90 91 L 78 100 L 83 87 L 72 78 L 85 78 Z"/>
      <!-- Star 2 -->
      <path d="M 120 65 L 125 78 L 138 78 L 127 87 L 132 100 L 120 91 L 108 100 L 113 87 L 102 78 L 115 78 Z"/>
      <!-- Star 3 -->
      <path d="M 150 65 L 155 78 L 168 78 L 157 87 L 162 100 L 150 91 L 138 100 L 143 87 L 132 78 L 145 78 Z"/>
      <!-- Star 4 -->
      <path d="M 180 65 L 185 78 L 198 78 L 187 87 L 192 100 L 180 91 L 168 100 L 173 87 L 162 78 L 175 78 Z"/>
      <!-- Star 5 -->
      <path d="M 210 65 L 215 78 L 228 78 L 217 87 L 222 100 L 210 91 L 198 100 L 203 87 L 192 78 L 205 78 Z"/>
    </g>
    
    <!-- Shine Effect -->
    <g fill="#FFA500" opacity="0.8">
      <rect x="215" y="35" width="8" height="20" rx="4"/>
      <rect x="230" y="45" width="8" height="15" rx="4" transform="rotate(45 234 52)"/>
      <rect x="240" y="60" width="8" height="15" rx="4" transform="rotate(45 244 67)"/>
    </g>
  </g>
</svg>
