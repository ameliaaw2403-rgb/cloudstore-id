<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="title desc">
  <title id="title">Cloud Store</title>
  <desc id="desc">Blue cloud logo with shopping cart and five golden stars</desc>
  <defs>
