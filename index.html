<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudstore.id — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="brand-card">
      <div class="brand-icon">☁</div>
      <h1>Cloudstore.id</h1>
      <p>Masuk untuk mulai menerima tugas dan komisi harian.</p>
    </section>

    <section class="login-card">
      <h2>Selamat datang</h2>
      <p class="subtitle">Masukan nomor handphone dan kata sandi akun anda.</p>

      <form id="loginForm">
        <label for="phone">Nomor Handphone</label>
        <input id="phone" name="phone" type="tel" inputmode="numeric"
               placeholder="08xxxxxxxxxx" autocomplete="tel" required>

        <label for="password">Kata Sandi</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 placeholder="Masukan kata sandi" autocomplete="current-password" required>
          <button type="button" id="togglePassword" aria-label="Tampilkan kata sandi">◉</button>
        </div>

        <button class="login-btn" type="submit">Masuk</button>
      </form>

      <a class="register" href="#" id="registerLink">Daftar sekarang</a>
    </section>

    <p class="terms">Dengan masuk, Anda menyetujuhi penggunaan akun Cloudstore.id.</p>
    <p class="demo-note" id="message" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
